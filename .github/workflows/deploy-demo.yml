name: Deploy Demo to GitHub Pages

on:
    push:
        branches: [main]
        paths:
            - 'demo/**'
            - 'demo-vue/**'
            - 'src/**'
            - '.github/workflows/deploy-demo.yml'
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install root dependencies
              run: npm ci

            - name: Build library
              run: npm run build

            - name: Install kanban demo dependencies
              working-directory: ./demo
              run: npm ci

            - name: Build kanban demo
              working-directory: ./demo
              run: npm run build

            - name: Install todo demo dependencies
              working-directory: ./demo-vue
              run: npm ci

            - name: Build todo demo
              working-directory: ./demo-vue
              run: npm run build

            # Both demos ship as one Pages site:
            #   /gittersync/       → kanban (vanilla TypeScript)
            #   /gittersync/todo/  → todo (Vue 3 + Pinia)
            # demo-vue is built with base '/gittersync/todo/', so nesting it
            # under the kanban output needs no rewriting.
            - name: Merge demos into one site
              run: |
                  mkdir -p demo/dist/todo
                  cp -r demo-vue/dist/. demo/dist/todo/
                  touch demo/dist/.nojekyll

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./demo/dist

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
